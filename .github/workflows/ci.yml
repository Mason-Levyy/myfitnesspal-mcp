name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run pytest

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c "
          import json, tomllib
          pyproject_version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          server = json.load(open('server.json'))
          versions = {pyproject_version, server['version'], server['packages'][0]['version']}
          assert len(versions) == 1, f'version mismatch: pyproject.toml={pyproject_version!r} server.json={server[\"version\"]!r}/{server[\"packages\"][0][\"version\"]!r}'
          "
