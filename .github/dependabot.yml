version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]

  # Reads pyproject.toml; uv.lock is intentionally not committed.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
    # Bumped by hand, on purpose:
    # - curl-cffi minors swap the bundled curl-impersonate, changing the TLS
    #   fingerprint MFP sees; nothing in CI exercises the network.
    # - mcp majors change the server API and how tool errors reach the model,
    #   so they need a port and a run against a real MCP client.
    ignore:
      - dependency-name: curl-cffi
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
