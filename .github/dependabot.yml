version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]

  # Reads pyproject.toml; uv.lock is intentionally not committed.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
    # Pinned on purpose: myfitnesspal is parsed by version-specific code and
    # curl-cffi's impersonation targets change between minors. Bump by hand.
    ignore:
      - dependency-name: myfitnesspal
      - dependency-name: curl-cffi
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
