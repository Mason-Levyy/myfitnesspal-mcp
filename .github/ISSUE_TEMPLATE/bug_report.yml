name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Redact your session cookie, CSRF tokens, user ids,
        and personal diary data** from anything you paste below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        Asked Claude to "log a banana as a snack". Expected it to appear in the diary;
        instead fitness_log_food returned "Session expired" even though I re-ran auth.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `uvx mfp-mcp auth`
        2. Call `fitness_log_food` with ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output / logs
      description: Server stderr, the MCP client's error, or a traceback. Redact tokens.
      render: shell
  - type: input
    id: version
    attributes:
      label: mfp-mcp version
      description: "`uvx mfp-mcp --version`, or the version in your lockfile"
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options:
        - uvx mfp-mcp
        - uvx --from 'mfp-mcp[autorefresh]'
        - pip / uv in a virtualenv
        - From a git checkout
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio (default)
        - HTTP (--http)
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, MCP client (Claude Desktop, Claude Code, other)
      placeholder: "Windows 11, Python 3.13, Claude Desktop"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I tried re-running `mfp-mcp auth` with a fresh cookie
        - label: I checked the README's Troubleshooting section
        - label: I have removed cookies, tokens, and personal data from this report
          required: true
